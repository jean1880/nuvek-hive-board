name: Release

# A v* tag runs every gate (gates.yml), builds static musl x86_64 binaries of hive-mcp and
# hive-gardener and, only when the repository variable PUBLISH is 'true' and every gate passed
# on the tagged commit, publishes them with SHA256SUMS and the notes from
# docs/releases/<tag>.md as a GitHub Release. Run by hand (workflow_dispatch), or with PUBLISH
# unset, it is a dry run: the binaries are built and kept as a workflow artifact only.
# The board itself ships as the container image (build.yml).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl

jobs:
  # Every gate (fmt, clippy, tests, MSRV, SPA, cargo-deny, gitleaks) on this exact commit.
  gates:
    uses: ./.github/workflows/gates.yml

  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the board version, and check the tag and notes match it
        id: read
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "hive-board") | .version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "hive-board version: $version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [[ "$tag" != "v$version" ]]; then
              echo "::error::Tag $tag does not match the hive-board version $version"
              exit 1
            fi
            notes="docs/releases/$tag.md"
            if [[ ! -s "$notes" ]]; then
              echo "::error::Missing release notes: $notes"
              exit 1
            fi
          fi

  build:
    name: Static binaries (${{ matrix.bin }})
    needs: [version, gates]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        bin: [hive-mcp, hive-gardener]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the musl target
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add "$TARGET"
      - name: Test the crate
        run: cargo test --locked -p ${{ matrix.bin }}
      - name: Build
        run: cargo build --locked --release -p ${{ matrix.bin }} --target "$TARGET"
      - name: Check it is static, and stage it
        run: |
          bin="target/$TARGET/release/${{ matrix.bin }}"
          file "$bin"
          if ldd "$bin" 2>/dev/null | grep -q '=>'; then
            echo "::error::${{ matrix.bin }} is dynamically linked"
            exit 1
          fi
          mkdir -p dist
          cp "$bin" "dist/${{ matrix.bin }}-${{ needs.version.outputs.version }}-x86_64-linux-musl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.bin }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish
    # Every gate must have passed on the very commit the tag points at.
    if: vars.PUBLISH == 'true' && startsWith(github.ref, 'refs/tags/v') && needs.gates.outputs.tested_commit == github.sha
    needs: [gates, version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          chmod 0755 -- *
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "hive-board $VERSION" \
            --notes-file "docs/releases/$TAG.md"
