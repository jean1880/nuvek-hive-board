# yaml-language-server: $schema=https://www.schemastore.org/github-issue-forms.json
name: Bug report
description: Something in hive-board, hive-mcp or hive-gardener doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. A bug that can be reproduced gets fixed first.

        **A security problem?** Don't file it here. Use [private vulnerability reporting](https://github.com/jean1880/nuvek-hive-board/security/advisories/new) (see [SECURITY.md](https://github.com/jean1880/nuvek-hive-board/blob/master/SECURITY.md)).

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched the [open and closed issues](https://github.com/jean1880/nuvek-hive-board/issues?q=is%3Aissue) and found no report of this.
          required: true
        - label: I removed API keys, tokens, hostnames and anything else private from what I paste below.
          required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      multiple: true
      options:
        - hive-board (server or API)
        - Web UI
        - hive-mcp
        - hive-gardener
        - Container image
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The requests, MCP tool calls or UI steps, with the settings that matter (secrets removed).
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The image tag, release or commit, and the Postgres version.
      placeholder: "v1.0.0, Postgres 16"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Log lines, browser console output, or workarounds you found.
