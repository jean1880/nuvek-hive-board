name: CI

# Every gate (gates.yml: fmt, clippy and tests for all three crates, MSRV, the SPA, cargo-deny and
# gitleaks) runs once, then the container image and, on a v* tag or a manual run, the static musl
# x86_64 binaries of hive-mcp and hive-gardener.
#
# Nothing publishes unless the repository variable PUBLISH is 'true' AND the ref is a v* tag AND
# every gate passed on this exact commit: only then does the image job push to GHCR and the
# release job publish the binaries, SHA256SUMS and docs/releases/<tag>.md as a GitHub Release.
# Every other run builds and discards the image; a manual run keeps the binaries as an artifact.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  schedule:
    # Advisories change underneath us as RustSec publishes, so the gates also run daily.
    - cron: "41 5 * * *"
  workflow_dispatch:

# A newer push to a pull request cancels its older run. Every other run gets a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl

jobs:
  gates:
    uses: ./.github/workflows/gates.yml

  image:
    name: Container image
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ vars.PUBLISH == 'true' && startsWith(github.ref, 'refs/tags/v') && needs.gates.outputs.tested_commit == github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (and push only for a published v* tag)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  version:
    name: Version
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the board version, and check the tag and notes match it
        id: read
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "hive-board") | .version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "hive-board version: $version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [[ "$tag" != "v$version" ]]; then
              echo "::error::Tag $tag does not match the hive-board version $version"
              exit 1
            fi
            notes="docs/releases/$tag.md"
            if [[ ! -s "$notes" ]]; then
              echo "::error::Missing release notes: $notes"
              exit 1
            fi
          fi

  binaries:
    name: Static binaries (${{ matrix.bin }})
    # The gates already tested every crate (workspace, all features) on this commit.
    needs: [version, gates]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        bin: [hive-mcp, hive-gardener]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the musl target
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add "$TARGET"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-musl-${{ matrix.bin }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-musl-${{ matrix.bin }}-
      - name: Build
        run: cargo build --locked --release -p ${{ matrix.bin }} --target "$TARGET"
      - name: Check it is static, and stage it
        run: |
          bin="target/$TARGET/release/${{ matrix.bin }}"
          file "$bin"
          if ldd "$bin" 2>/dev/null | grep -q '=>'; then
            echo "::error::${{ matrix.bin }} is dynamically linked"
            exit 1
          fi
          mkdir -p dist
          cp "$bin" "dist/${{ matrix.bin }}-${{ needs.version.outputs.version }}-x86_64-linux-musl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.bin }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish
    # Every gate must have passed on the very commit the tag points at.
    if: vars.PUBLISH == 'true' && startsWith(github.ref, 'refs/tags/v') && needs.gates.outputs.tested_commit == github.sha
    needs: [gates, version, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          chmod 0755 -- *
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "hive-board $VERSION" \
            --notes-file "docs/releases/$TAG.md"
